[package]
name = "ccline"
version = "0.1.5"
edition = "2024"
description = "Fast Claude Code statusline (ccstatusline replacement)"
authors = ["Viktar Hushchynski <viktar.hushchynski@gmail.com>"]
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
opt-level = "z"
